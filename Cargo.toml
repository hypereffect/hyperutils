[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
hyperserve = { path = "crates/hyperserve" }
hyperb-core = { path = "../hyperb/crates/core" }
hypereffect = "0.5"
iroh = "1.3"
tokio = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
