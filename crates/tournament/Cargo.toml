[package]
name = "tournament"
version.workspace = true
edition = "2024"
license.workspace = true
description = "Round-robin tournaments for hyperb: list the teams, get the fixtures, share links to enter results and to follow the standings"

[dependencies]
hyperserve.workspace = true
hyperb-core.workspace = true
hypereffect.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "signal"] }
clap.workspace = true
serde.workspace = true
orangedb.workspace = true
cuid2 = "0.1"

[dev-dependencies]
hypereffect = { workspace = true, features = ["client"] }
