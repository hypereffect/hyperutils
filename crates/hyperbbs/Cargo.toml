[package]
name = "hyperbbs"
version.workspace = true
edition = "2021"
license.workspace = true
description = "An old-school BBS whose screens are hypereffect components, served to hyperb over HTTPS and iroh"

[dependencies]
hyperserve = { workspace = true, features = ["iroh"] }
hyperb-core.workspace = true
hypereffect.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
orangedb.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap.workspace = true

[dev-dependencies]
hypereffect = { workspace = true, features = ["client"] }
# The renderers' own iroh session, for the end-to-end test.
hyperb-core = { workspace = true, features = ["iroh"] }
tempfile = "3"
